name: process-product-images
on:
  push:
    branches: [asset-pipeline]
    paths: [images2.txt, process2.py, cutout.py]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install "rembg[cpu]" pillow opencv-contrib-python-headless numpy scipy pymatting
      - run: python process2.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add out2
          git commit -m "Processed product images v2 [skip ci]" || echo "nothing to commit"
          git pull --rebase
          git push
